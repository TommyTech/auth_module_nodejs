name: Continuous Integration

on: [pull_request]

jobs:
  build:
    name: Sanitize & Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm install

    - run: npm run lint
    - run: npm run build
    - run: npm run test
